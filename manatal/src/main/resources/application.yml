spring:
  application:
    name: manatal-migration

  profiles:
    active: prod

  batch:
    job:
      enabled: false

migration:
  manatal:
    source:
      token: ${MANATAL_TOKEN:}
    target:
      token: ${MANATAL_TARGET_TOKEN:}
    base-url: https://api.manatal.com/open/v3/
    page-size: 100
    rate-limit-retry-seconds: 60
    # Fallback name for notes whose creator user was DELETED in source (not in /users/).
    # Format: "creator_id: Full Name". Unresolved notes are still migrated, without the name prefix.
    creator-name-mapping:
      234956: "Ex-colaborador"
    # Stage name translation source → target (candidate matches). Match is done by NAME on the
    # target job's pipeline; IDs differ across companies. Unmapped names fall back to identity.
    stage-mapping:
      "New Candidates": "Pre-selection"
      "Analyzed": "Pre-selection"
      "Contacted": "Contacted"
      "HR Round": "Recruiter /Team leader / BM - Interviews"
      "Manager Round": "Send Candidates to KAM"
      "Waiting Technical Test": "Send Candidates to KAM"
      "In Client": "Send Candidates to Client"
      "Offered": "Proposal / Approved"
      "Hired": "Started"

  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:24}
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    enable:
      all: true


app:
  base-url: http://localhost:8080

